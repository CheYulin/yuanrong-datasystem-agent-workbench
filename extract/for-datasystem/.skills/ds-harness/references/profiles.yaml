version: 1
defaults:
  node: tiantiyun-80c128g
  backend: cmake
  evidence_root: results/ds-harness
  remote_build_dir: /root/workspace/build-remote-datasystem
  long_tail_top_n: 10
script_owners:
  .skills/ds-build/scripts/build_cmake.sh: ds-build
  .skills/ds-build/scripts/build_bazel.sh: ds-build
  .skills/ds-build/scripts/rsync_datasystem_remote_bazel.sh: ds-build
  .skills/ds-dev/scripts/lint/check_cpp_line_width.sh: ds-dev
  .skills/ds-dev/scripts/verify/smoke/run_smoke_remote.sh: ds-dev
  .skills/ds-dev/scripts/verify/ut/run_ut_remote.sh: ds-dev
  .skills/ds-dev/scripts/verify/st/run_st_remote.sh: ds-dev
  .skills/ds-dev/scripts/verify/validate_kv_executor.sh: ds-dev
  .skills/ds-dev/scripts/verify/validate_urma_tcp_observability_logs.sh: ds-dev
  .skills/ds-dev/scripts/verify/smoke/harness_zmq_metrics_e2e.sh: ds-dev
  .skills/ds-daily/scripts/verify/nightly_zmq_regression.sh: ds-daily
  .skills/ds-daily/scripts/perf/zmq_rpc_perf_nightly.sh: ds-daily
evidence_schema:
  required_files:
  - summary.json
  - steps.jsonl
  optional_files:
  - build_timing.csv
  - test_results.json
  - coverage.json
  - perf_hotspots.md
  - bench_results.json
acceptance_metrics:
  build:
    required_dry_run_status: DRY_RUN
    required_real_status: PASS
    required_evidence:
    - summary.json
    - steps.jsonl
    - build_timing.csv
    max_long_tail_entries: 10
    must_report:
    - total_elapsed_sec
    - top_slow_steps
    - optimization_hint
  dev:
    required_dry_run_status: DRY_RUN
    required_real_status: PASS
    required_steps:
    - lint-line-width
    - smoke
    - ut
    - st
    required_evidence:
    - summary.json
    - steps.jsonl
    - test_results.json
    max_minutes:
      smoke: 5
      ut: 30
      st: 60
    failure_summary_fields:
    - failed_layer
    - command
    - log
  dev_full:
    required_dry_run_status: DRY_RUN
    required_real_status: PASS
    required_steps:
    - lint-line-width
    - build
    - smoke
    - ut
    - st
    required_evidence:
    - summary.json
    - steps.jsonl
    - test_results.json
    max_minutes:
      build: 30
      smoke: 5
      ut: 30
      st: 60
    failure_summary_fields:
    - failed_layer
    - command
    - log
  daily:
    required_dry_run_status: DRY_RUN
    required_real_status: PASS
    required_steps:
    - build
    - smoke
    - ut
    - st
    - coverage
    - perf-regression
    required_evidence:
    - summary.json
    - steps.jsonl
    - test_results.json
    - coverage.json
    - perf_hotspots.md
    coverage:
      line_percent_min: 0
      function_percent_min: 0
      branch_percent_min: 0
    perf:
      p95_regression_percent_max: 10
  perf:
    required_dry_run_status: DRY_RUN
    required_real_status: PASS
    min_supported_sources: 1
    required_evidence:
    - summary.json
    - steps.jsonl
    - perf_hotspots.md
    required_report_sections:
    - Evidence
    - Judgment
    - Suggestion
    - Recheck
profiles:
  build.quick:
    command_group: build
    description: Fast backend build with timing evidence.
    evidence:
    - build_timing.csv
    skill: ds-build
    steps:
    - command:
        bazel: bash .skills/ds-build/scripts/build_bazel.sh
        cmake: bash .skills/ds-build/scripts/build_cmake.sh
      id: build
      label: Build selected backend
      uses:
        bazel: .skills/ds-build/scripts/build_bazel.sh
        cmake: .skills/ds-build/scripts/build_cmake.sh
  build.full:
    command_group: build
    description: Remote Bazel-capable full build and long-tail timing profile.
    evidence:
    - build_timing.csv
    skill: ds-build
    steps:
    - command:
        bazel: bash .skills/ds-build/scripts/rsync_datasystem_remote_bazel.sh --node
          {node}
      id: sync-remote-bazel
      label: Sync datasystem and run remote Bazel path
      uses:
        bazel: .skills/ds-build/scripts/rsync_datasystem_remote_bazel.sh
    - command:
        cmake: bash .skills/ds-build/scripts/build_cmake.sh
      id: build-cmake
      label: Run CMake build path when backend is cmake
      uses:
        cmake: .skills/ds-build/scripts/build_cmake.sh
  dev.quick:
    acceptance_group: dev
    command_group: dev
    description: 'Fast PR loop: lint + smoke/UT/ST with --skip-build (run wb-build
      first).'
    evidence:
    - test_results.json
    skill: ds-dev
    steps:
    - command: bash .skills/ds-dev/scripts/lint/check_cpp_line_width.sh --staged
      id: lint-line-width
      label: C++ line-width check
      uses: .skills/ds-dev/scripts/lint/check_cpp_line_width.sh
    - command: bash .skills/ds-dev/scripts/verify/smoke/run_smoke_remote.sh --node
        {node} --skip-build --skip-zmq-gate
      id: smoke
      label: Remote smoke tests
      uses: .skills/ds-dev/scripts/verify/smoke/run_smoke_remote.sh
    - command: UT_CTEST_REGEX='MetricsTest' bash .skills/ds-dev/scripts/verify/ut/run_ut_remote.sh
        --node {node} --skip-build
      id: ut
      label: Remote unit tests
      uses: .skills/ds-dev/scripts/verify/ut/run_ut_remote.sh
    - command: bash .skills/ds-dev/scripts/verify/st/run_st_remote.sh --node {node}
        --skip-build
      id: st
      label: Remote system tests
      uses: .skills/ds-dev/scripts/verify/st/run_st_remote.sh
    stop_on_failure: true
  dev.default:
    acceptance_group: dev_full
    command_group: dev
    description: Full dev loop with build step — manual/nightly only.
    evidence:
    - test_results.json
    skill: ds-dev
    steps:
    - command: bash .skills/ds-dev/scripts/lint/check_cpp_line_width.sh --staged
      id: lint-line-width
      label: C++ line-width check
      uses: .skills/ds-dev/scripts/lint/check_cpp_line_width.sh
    - command: cd {datasystem_root} && bash build.sh -b {backend} -t build -B /root/workspace/build-remote-datasystem
        -j "$(nproc)"
      id: build
      label: Build selected backend once before test gates
      uses: yuanrong-datasystem/build.sh
    - command: BUILD_DIR=/root/workspace/build-remote-datasystem bash .skills/ds-dev/scripts/verify/smoke/run_smoke_remote.sh
        --node {node} --skip-build
      id: smoke
      label: Remote smoke tests
      uses: .skills/ds-dev/scripts/verify/smoke/run_smoke_remote.sh
    - command: BUILD_DIR=/root/workspace/build-remote-datasystem bash .skills/ds-dev/scripts/verify/ut/run_ut_remote.sh
        --node {node} --skip-build
      id: ut
      label: Remote unit tests
      uses: .skills/ds-dev/scripts/verify/ut/run_ut_remote.sh
    - command: BUILD_DIR=/root/workspace/build-remote-datasystem bash .skills/ds-dev/scripts/verify/st/run_st_remote.sh
        --node {node} --skip-build
      id: st
      label: Remote system tests
      uses: .skills/ds-dev/scripts/verify/st/run_st_remote.sh
    stop_on_failure: true
  daily.full:
    command_group: daily
    description: 'Full daily build: all tests, coverage, perf regression, long-tail
      and flake evidence.'
    evidence:
    - test_results.json
    - coverage.json
    - perf_hotspots.md
    skill: ds-daily
    steps:
    - command: cd {datasystem_root} && bash build.sh -b {backend} -t build -B /root/workspace/build-remote-datasystem
        -j "$(nproc)"
      id: build
      label: Build selected backend once before full gates
      uses: yuanrong-datasystem/build.sh
    - command: BUILD_DIR=/root/workspace/build-remote-datasystem bash .skills/ds-dev/scripts/verify/smoke/run_smoke_remote.sh
        --node {node} --skip-build
      id: smoke
      label: Full smoke tests
      uses: .skills/ds-dev/scripts/verify/smoke/run_smoke_remote.sh
    - command: BUILD_DIR=/root/workspace/build-remote-datasystem bash .skills/ds-dev/scripts/verify/ut/run_ut_remote.sh
        --node {node} --skip-build
      id: ut
      label: Full unit tests
      uses: .skills/ds-dev/scripts/verify/ut/run_ut_remote.sh
    - command: BUILD_DIR=/root/workspace/build-remote-datasystem bash .skills/ds-dev/scripts/verify/st/run_st_remote.sh
        --node {node} --skip-build
      id: st
      label: Full system tests
      uses: .skills/ds-dev/scripts/verify/st/run_st_remote.sh
    - command: cd {datasystem_root} && bash build.sh -b {backend} -c html -t run
      id: coverage
      label: Coverage collection through datasystem build.sh
      uses: yuanrong-datasystem/build.sh
    - command: bash .skills/ds-daily/scripts/perf/zmq_rpc_perf_nightly.sh --node {node}
      id: perf-regression
      label: ZMQ RPC perf regression
      uses: .skills/ds-daily/scripts/perf/zmq_rpc_perf_nightly.sh
    stop_on_failure: true
    thresholds:
      coverage:
        branch_percent_min: 0
        function_percent_min: 0
        line_percent_min: 0
      perf:
        p95_regression_percent_max: 10
skill_verify:
  ds-build:
    node: tiantiyun-80c128g
    steps:
    - harness: build
      profile: build.quick
      dry_run: false
  ds-dev:
    node: tiantiyun-80c128g
    steps:
    - harness: dev
      profile: dev.quick
      dry_run: false
  ds-daily:
    node: tiantiyun-80c128g
    steps:
    - harness: daily
      profile: daily.full
      dry_run: true
