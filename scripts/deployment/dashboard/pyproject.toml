[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard"
version = "0.1.0"
description = "Local-to-Remote Deployment Dashboard — rsync over SSH with a web UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "yche", email = "yche@example.com"},
]
keywords = ["deployment", "rsync", "ssh", "sftp", "dashboard", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
]
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
    "paramiko>=3.0",
    "python-socketio>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
dashboard = "dashboard.__main__:main"

[project.urls]
Homepage = "https://github.com/yche/yuanrong-datasystem-agent-workbench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
